<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3>Owner Registration</h3>
            </div>

            <div class="card-body">
                <form #ownerForm="ngForm" (ngSubmit)="onSubmit(ownerForm)">
                    <div class="row">
                        <!-- Email -->
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email" [(ngModel)]="owner.email" #email="ngModel" placeholder="Enter your email" required email>

                                <div *ngIf="email.invalid && email.touched"
                                     class="text-danger">
                                    <small *ngIf="email.errors?.['required']">
                                        Email is required.
                                    </small>
                                    <small *ngIf="email.errors?.['email']">
                                        Please enter a valid email.
                                    </small>
                                </div>
                            </div>
                        </div>

                        <!-- Mobile -->
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="mobile">Mobile</label>

                                <input type="tel"
                                       class="form-control"
                                       id="mobile"
                                       name="mobile"
                                       [(ngModel)]="owner.mobile"
                                       #mobile="ngModel"
                                       placeholder="Enter your mobile number"
                                       required>

                                <div *ngIf="mobile.invalid && mobile.touched"
                                     class="text-danger">
                                    <small>
                                        Mobile number is required.
                                    </small>
                                </div>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="password">Password</label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       [(ngModel)]="owner.password"
                                       #password="ngModel"
                                       placeholder="Enter your password"
                                       required
                                       minlength="6">

                                <div *ngIf="password.invalid && password.touched"
                                     class="text-danger">
                                    <small *ngIf="password.errors?.['required']">
                                        Password is required.
                                    </small>
                                    <small *ngIf="password.errors?.['minlength']">
                                        Password must be at least 6 characters.
                                    </small>
                                </div>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="confirmPassword">Confirm Password</label>

                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       [(ngModel)]="owner.confirmPassword"
                                       #confirmPassword="ngModel"
                                       placeholder="Confirm your password"
                                       required>

                                <div *ngIf="confirmPassword.invalid && confirmPassword.touched"
                                     class="text-danger">
                                    <small>
                                        Confirm password is required.
                                    </small>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Submit Button -->
                    <div class="text-center mt-3">
                        <button type="submit"
                                class="btn btn-primary"
                                [disabled]="ownerForm.invalid">
                            Register
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
