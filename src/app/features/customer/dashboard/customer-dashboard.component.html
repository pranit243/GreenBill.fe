<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col">
      <h2 class="fw-bold text-info"><i class="bi bi-person-circle me-2"></i>Customer Dashboard</h2>
      <p class="text-muted">View your bills and manage your profile</p>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center">
          <div class="rounded-circle bg-info bg-opacity-10 p-3 me-3">
            <i class="bi bi-receipt-cutoff text-info fs-4"></i>
          </div>
          <div>
            <div class="fw-semibold">My Bills</div>
            <small class="text-muted">View &amp; download bills</small>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center">
          <div class="rounded-circle bg-success bg-opacity-10 p-3 me-3">
            <i class="bi bi-person-gear text-success fs-4"></i>
          </div>
          <div>
            <div class="fw-semibold">Profile</div>
            <small class="text-muted">Manage account settings</small>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center">
          <div class="rounded-circle bg-warning bg-opacity-10 p-3 me-3">
            <i class="bi bi-bell text-warning fs-4"></i>
          </div>
          <div>
            <div class="fw-semibold">Notifications</div>
            <small class="text-muted">Bill delivery alerts</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-info">
    <i class="bi bi-info-circle me-2"></i>
    Bills will appear here in real-time via SignalR once the Billing Service is online.
  </div>
</div>
